<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Admin</title>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">
    <section class="relative min-h-[520px] overflow-hidden">
        <img src="./img/dark image.jpeg" alt="Background image" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/70 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>
        <header class="relative z-10 border-b border-white/10 bg-gradient-to-b from-black/60 to-transparent">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-3">
                <img src="./img/logo.svg" alt="Logo de CinéTrack" class="h-10 w-auto">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="bg-red-600/60 border border-gray-700 text-sm sm:text-base p-2.5 rounded-lg shadow text-white hover:bg-red-600">
                       Catalog
                    </a>
                </div>
            </div>
        </header>
        <div class="relative px-4 py-10 text-white">
            <form id="movieForm" class="mx-auto max-w-7xl rounded-xl border border-slate-700 bg-slate-800 p-6">
                <h2 class="text-lg font-bold">Add a movie or a series</h2>
                <p class="mb-4 border-b border-slate-700 pb-4 text-xs text-slate-400">
                    Fill in the details of the title to add.
                </p>
                <div class="grid gap-4 sm:grid-cols-3">
                    <div class="sm:col-span-2">
                        <label class="mb-1 block text-xs font-semibold">Title *</label>
                        <input type="text" id="title" placeholder="Ex: Inception" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none" required/>
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Type *</label>
                        <select id="type" required class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm focus:border-red-500 focus:outline-none">
                            <option>Movie</option>
                            <option>Series</option>
                        </select>
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Year *</label>
                        <input type="number" id="year" required placeholder="Ex: 2010" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                    </div>
                    <div>
                        <div id="durationWrapper">
                            <label class="mb-1 block text-xs font-semibold">Duration (min) *</label>
                            <input type="number" id="duration" required placeholder="Ex: 148" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                        </div>
                        <div id="seasonsWrapper" class="hidden">
                            <label class="mb-1 block text-xs font-semibold">Seasons *</label>
                            <input type="number" id="seasons" min="1" placeholder="Ex: 4" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                        </div>
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Poster URL *</label>
                        <input type="url" id="poster" required placeholder="https://..." class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                    </div>
                </div>
                <div class="mt-4 grid gap-4 sm:grid-cols-3">
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Genres *</label>
                        <input type="text" id="genres" placeholder="Ex: Action, Drama" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Directors *</label>
                        <input type="text" id="directors" placeholder="Ex: Christopher Nolan" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-semibold">Countries *</label>
                        <input type="text" id="countries" placeholder="Ex: USA, UK" class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"/>
                    </div>
                </div>
                <div class="mt-4">
                    <label class="mb-1 block text-xs font-semibold">Description *</label>
                    <textarea id="description" rows="3" placeholder="Synopsis of the movie or series..." class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none"></textarea>
                </div>
                <div class="mt-4 flex justify-end border-t border-slate-700 pt-4">
                    <button type="submit" id="submitBtn" class="rounded-md bg-red-600 px-4 py-2 text-sm font-semibold hover:bg-red-700">
                        Add title
                    </button>
                </div>
            </form>
        </div>
    </section>
    <p id="message" class="relative ml-28"></p>
    <div id="table" class="relative hidden mx-auto max-w-7xl overflow-x-auto rounded-xl border border-slate-700 bg-slate-800 p-6 px-4 py-10">
        <table id="moviesTable" class="w-full text-left text-sm">
            <thead class="border-b border-slate-700 text-xs uppercase text-slate-400">
                <tr>
                    <th class="px-4 py-3 font-semibold">Movies/Series</th>
                    <th class="px-4 py-3 font-semibold">Type</th>
                    <th class="px-4 py-3 font-semibold text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-700"></tbody>
        </table>
    </div>
    <script src="./admin.js/app.js"></script>
</body>
</html>
